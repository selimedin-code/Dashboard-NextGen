<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}NextGen Fund Dashboard{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}" />
</head>
<body>
  <div class="wrap">
    {% set path = request.url.path %}
    <nav class="nav">
      <a class="nav-brand" href="/">
        <img src="{{ url_for('static', path='logo.svg') }}" alt="VT Wealth" />
        <b>NextGen</b>
      </a>
      <div class="nvt-grp">
        <a href="/" class="nvt{{ ' nvt-on' if path == '/' else '' }}">Overview</a>
        <a href="/changes" class="nvt{{ ' nvt-on' if path.startswith('/changes') else '' }}">Changes</a>
        <a href="/positions" class="nvt{{ ' nvt-on' if path.startswith('/positions') else '' }}">Positions</a>
        <a href="/exposure" class="nvt{{ ' nvt-on' if path.startswith('/exposure') else '' }}">Exposure</a>
        <a href="/performance" class="nvt{{ ' nvt-on' if path.startswith('/performance') else '' }}">Performance</a>
        <a href="/signals" class="nvt{{ ' nvt-on' if path.startswith('/signals') else '' }}">Signals</a>
        <a href="/pillars" class="nvt{{ ' nvt-on' if path.startswith('/pillars') else '' }}">Pillars</a>
        <a href="/upload" class="nvt{{ ' nvt-on' if path.startswith('/upload') else '' }}">Upload</a>
      </div>
    </nav>

    {% block content %}{% endblock %}

    <footer>NextGen Fund Dashboard &middot; internal monitoring tool</footer>
  </div>
</body>
</html>
